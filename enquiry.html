<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Little Cake Shop | Enquiry</title>
<link rel="stylesheet" href="Poe Assessment Part2.css">
<style>

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --green:#4f8f68;
  --green-dark:#326847;
  --purple:#7b4b9b;
  --pink:#e98bb5;
  --pink-light:#fff0f7;
  --cream:#fffaf5;
  --text:#29232b;
  --muted:#6f6870;
  --white:#fff;
  --border:#eadce6;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.6;
}
a{text-decoration:none;color:inherit}
img{width:100%;display:block}
.container{width:min(1120px,92%);margin:auto}

/* Header */
header{
  background:var(--white);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}
.navbar{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}
.logo{
  width:105px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--purple);
  border-radius:12px;
  color:var(--purple);
  font-family:'Baloo 2',cursive;
  font-size:22px;
  font-weight:700;
  background:var(--pink-light);
}
.nav-links{display:flex;gap:30px;list-style:none}
.nav-links a{
  font-size:14px;
  font-weight:600;
  color:#514951;
  padding:27px 0 8px;
  border-bottom:3px solid transparent;
}
.nav-links a:hover,.nav-links a.active{
  color:var(--purple);
  border-color:var(--pink);
}

/* Common */
.page-title{text-align:center;padding:55px 0 30px}
.page-title h1{
  font-family:'Baloo 2',cursive;
  color:var(--purple);
  font-size:42px;
  line-height:1.1;
}
.page-title p{color:var(--muted);margin-top:8px}
.btn{
  display:inline-block;
  border:0;
  cursor:pointer;
  padding:12px 24px;
  border-radius:25px;
  font-weight:700;
  font-family:inherit;
  background:var(--purple);
  color:white;
  transition:.2s;
}
.btn:hover{transform:translateY(-2px);background:var(--green-dark)}
.btn-pink{background:var(--pink);color:#fff}
.section{padding:55px 0}
.section-title{
  text-align:center;
  color:var(--purple);
  font-family:'Baloo 2',cursive;
  font-size:32px;
  margin-bottom:28px;
}

/* Home */
.hero{
  min-height:440px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    linear-gradient(135deg,rgba(79,143,104,.88),rgba(123,75,155,.83)),
    url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1600&q=80') center/cover;
  color:white;
}
.hero-content{max-width:700px}
.hero h1{
  font-family:'Baloo 2',cursive;
  font-size:58px;
  line-height:1.05;
}
.hero p{font-size:19px;margin:15px 0 25px}

.cake-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}
.cake-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 7px 20px rgba(71,42,75,.07);
  transition:.2s;
}
.cake-card:hover{transform:translateY(-5px)}
.cake-card img{height:190px;object-fit:cover}
.cake-info{padding:18px}
.cake-info h3{color:var(--green-dark);margin-bottom:5px}
.cake-info p{font-size:14px;color:var(--muted);margin-bottom:13px}
.price{font-weight:700;color:var(--purple);font-size:18px;margin-bottom:12px}

/* About */
.about-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
  margin-bottom:50px;
}
.about-row.reverse .about-image{order:2}
.about-image img{height:260px;object-fit:cover;border-radius:18px}
.about-text h2{font-family:'Baloo 2',cursive;color:var(--purple);font-size:30px}
.about-text p{color:var(--muted);margin-top:10px}

/* Forms */
.form-box{
  background:white;
  max-width:850px;
  margin:0 auto 60px;
  padding:35px;
  border-radius:18px;
  border:1px solid var(--border);
  box-shadow:0 8px 25px rgba(71,42,75,.08);
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group.full{grid-column:1/-1}
label{font-weight:600;font-size:14px;color:var(--green-dark)}
input,select,textarea{
  width:100%;
  border:1px solid #d9ccd5;
  border-radius:8px;
  padding:12px;
  font:inherit;
  outline:none;
  background:#fff;
}
input:focus,select:focus,textarea:focus{border-color:var(--pink)}
textarea{min-height:150px;resize:vertical}

/* Contact */
.location-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px}
.location-card{
  background:white;border:1px solid var(--border);border-radius:15px;padding:22px
}
.location-card h3{color:var(--purple);margin-bottom:10px}
.location-card p{font-size:14px;color:var(--muted)}
.map{
  height:260px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(45deg,transparent 49%,rgba(123,75,155,.13) 50%,transparent 51%),
    linear-gradient(-45deg,transparent 49%,rgba(233,139,181,.13) 50%,transparent 51%),
    #f7eef6;
  border:1px solid var(--border);
  font-size:50px;
  color:var(--purple);
  margin-bottom:30px;
}
.contact-bottom{display:grid;grid-template-columns:2fr 1fr;gap:30px}
.socials{display:flex;gap:12px;margin-top:15px}
.socials a{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--green);color:#fff;font-weight:700;
}
.hours{margin-top:20px}
.hours p{font-size:14px;color:var(--muted)}

/* Footer */
footer{background:#2e3e35;color:white;margin-top:20px}
.footer-main{
  padding:35px 0;
  display:grid;
  grid-template-columns:1.5fr 1fr 1.2fr 1fr;
  gap:30px;
}
.footer-main h3,.footer-main h4{color:#f6c3da;margin-bottom:10px}
.footer-main p,.footer-main a{font-size:13px;color:#e7e0e5}
.footer-main ul{list-style:none}
.footer-main li{margin:4px 0}
.footer-main a:hover{color:#fff}
.copyright{text-align:center;border-top:1px solid rgba(255,255,255,.15);padding:14px;font-size:12px}

/* Responsive */
@media(max-width:800px){
  .navbar{flex-direction:column;padding:15px 0}
  .nav-links{gap:14px;flex-wrap:wrap;justify-content:center}
  .nav-links a{padding:5px 0}
  .hero h1{font-size:42px}
  .cake-grid,.about-row,.location-grid,.contact-bottom,.footer-main{grid-template-columns:1fr}
  .about-row.reverse .about-image{order:0}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}


/* Little Cake Shop Logo */
.logo {
    min-width: 190px;
}
.logo-text {
    white-space: nowrap;
}
.logo-small {
    letter-spacing: 2px;
}
.logo-main {
    font-size: 30px;
}

</style></head>
<body>
<header><div class="container navbar"><a class="logo" href="index.html">Cake shop</a><nav>
<ul class="nav-links">
<li><a href="index.html">HOME</a></li>
<li><a href="about.html">ABOUT</a></li>
<li><a href="cakes.html">CAKES</a></li>
<li><a href="enquiry.html" class="active">ENQUIRY</a></li>
<li><a href="contact.html">CONTACT</a></li>
</ul>
</nav></div></header>
<div class="page-title"><h1>MAKE AN ENQUIRY</h1><p>Tell us what you need and we'll help make it special.</p></div>
<section class="section"><div class="container"><form class="form-box" onsubmit="event.preventDefault(); alert('Thank you! Your enquiry has been received.');">
<div class="form-grid">
<div class="form-group"><label>Full Name</label><input type="text" placeholder="Your full name" required></div>
<div class="form-group"><label>Email Address</label><input type="email" placeholder="Your email" required></div>
<div class="form-group"><label>Phone Number</label><input type="tel" placeholder="Your phone number" required></div>
<div class="form-group"><label>Event Date</label><input type="date" required></div>
<div class="form-group full"><label>Cake Type / Flavour</label><select required><option value="">e.g. Chocolate, Vanilla, Red Velvet</option><option>Birthday Cake</option><option>Wedding Cake</option><option>Chocolate Cake</option><option>Cupcakes</option><option>Red Velvet Cake</option><option>Celebration Cake</option></select></div>
<div class="form-group full"><label>Message</label><textarea placeholder="Tell us more about your requirements..." required></textarea></div>
<div class="form-group full" style="align-items:center"><button class="btn" type="submit">SUBMIT ENQUIRY</button></div>
</div></form></div></section>
<footer></footer><script src="footer.js"></script>
</body></html>
